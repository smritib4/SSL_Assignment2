# Validation winner among the ResNet-18 runs: simclr_finetune.
# Same settings as configs/simclr_finetune.yaml. The scored weights are
# runs/simclr_finetune_seed0/best.pt. This file was not trained again.
experiment:
  name: best
  notes: SSL init, backbone LR 1e-4, head LR 1e-3. Validation winner.
  mode: supervised
  seed: 0

data:
  img_size: 128
  batch_size: 64

augment:
  train_crop_scale: [0.65, 1.0]
  hflip: 0.5
  color_jitter: 0.2
  jitter_hue: 0.05
  jitter_p: 1.0
  grayscale_p: 0.0
  blur_p: 0.0
  random_erasing: 0.1

model:
  name: resnet18
  dropout: 0.0
  freeze_encoder: false

ssl:
  init_checkpoint: runs/simclr_pretrain_seed0/last.pt

optim:
  lr: 0.0001
  head_lr_mult: 10.0
  weight_decay: 0.01
  warmup_epochs: 3
  epochs: 50
  label_smoothing: 0.1
