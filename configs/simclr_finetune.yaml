# Practical fine-tune. The encoder learned something in SimCLR, so it gets a
# 10x smaller learning rate than the new head. This is the same idea as
# Assignment 1's discriminative learning rates, applied to features that were
# learned on this dataset rather than on ImageNet.
# It is not a single-factor comparison with the baseline. Use
# simclr_finetune_matched.yaml for that.
experiment:
  name: simclr_finetune
  notes: SSL init, backbone LR 1e-4, head LR 1e-3.
  mode: supervised
  seed: 0

data:
  img_size: 128
  batch_size: 64

augment:
  train_crop_scale: [0.65, 1.0]
  hflip: 0.5
  color_jitter: 0.2
  jitter_hue: 0.05
  jitter_p: 1.0
  grayscale_p: 0.0
  blur_p: 0.0
  random_erasing: 0.1

model:
  name: resnet18
  dropout: 0.0
  freeze_encoder: false

ssl:
  init_checkpoint: runs/simclr_pretrain_seed0/last.pt

optim:
  lr: 0.0001
  head_lr_mult: 10.0
  weight_decay: 0.01
  warmup_epochs: 3
  epochs: 50
  label_smoothing: 0.1
