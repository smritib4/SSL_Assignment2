# Clean comparison against configs/resnet18_supervised.yaml.
# Same architecture, augmentation, learning rate, epoch budget, and split.
# The only change is that the encoder starts from SimCLR instead of random weights.
experiment:
  name: simclr_finetune_matched
  notes: SSL init, otherwise identical to the supervised baseline.
  mode: supervised
  seed: 0

data:
  img_size: 128
  batch_size: 64

augment:
  train_crop_scale: [0.65, 1.0]
  hflip: 0.5
  color_jitter: 0.2
  jitter_hue: 0.05
  jitter_p: 1.0
  grayscale_p: 0.0
  blur_p: 0.0
  random_erasing: 0.1

model:
  name: resnet18
  dropout: 0.0
  freeze_encoder: false

ssl:
  init_checkpoint: runs/simclr_pretrain_seed0/last.pt

optim:
  lr: 0.001
  head_lr_mult: 1.0
  weight_decay: 0.01
  warmup_epochs: 5
  epochs: 50
  label_smoothing: 0.1
