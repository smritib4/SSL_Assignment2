# Linear probe: freeze the SimCLR encoder, train a new 16-way head.
# This asks whether the pretraining actually separated the classes, before
# any fine-tuning is allowed to rewrite the features.
experiment:
  name: simclr_linear_probe
  notes: Frozen SimCLR encoder, linear head only.
  mode: supervised
  seed: 0

data:
  img_size: 128
  batch_size: 64

augment:
  train_crop_scale: [0.65, 1.0]
  hflip: 0.5
  color_jitter: 0.2
  jitter_hue: 0.05
  jitter_p: 1.0
  grayscale_p: 0.0
  blur_p: 0.0
  random_erasing: 0.1

model:
  name: resnet18
  dropout: 0.0
  freeze_encoder: true

ssl:
  init_checkpoint: runs/simclr_pretrain_seed0/last.pt
  temperature: 0.2

optim:
  lr: 0.001
  head_lr_mult: 1.0
  weight_decay: 0.0
  warmup_epochs: 0
  epochs: 30
  label_smoothing: 0.0
