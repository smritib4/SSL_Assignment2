# One-epoch CPU check. Not a result.
experiment:
  name: smoke
  notes: Pipeline check on dummy data.
  mode: supervised
  seed: 0

data:
  root: data_dummy
  img_size: 64
  batch_size: 16
  num_workers: 0
  val_fraction: 0.25

augment:
  random_erasing: 0.0
  color_jitter: 0.0
  blur_p: 0.0

model:
  name: resnet18
  dropout: 0.0
  freeze_encoder: false

ssl:
  temperature: 0.2
  lambda_contrast: 0.2
  proj_hidden: 64
  proj_dim: 32

optim:
  epochs: 1
  warmup_epochs: 0
  amp: false
  label_smoothing: 0.0
