experiment:
  name: simclr_finetune_matched
  notes: SSL init, otherwise identical to the supervised baseline.
  seed: 0
  mode: supervised
  config_path: configs/simclr_finetune_matched.yaml
data:
  root: data
  train_dir: train
  test_dir: test
  val_fraction: 0.2
  split: stratified
  batch_size: 64
  num_workers: 2
  img_size: 128
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
augment:
  train_crop_scale:
  - 0.65
  - 1.0
  hflip: 0.5
  color_jitter: 0.2
  jitter_hue: 0.05
  jitter_p: 1.0
  grayscale_p: 0.0
  blur_p: 0.0
  blur_sigma:
  - 0.1
  - 2.0
  random_erasing: 0.1
model:
  name: resnet18
  dropout: 0.0
  freeze_encoder: false
ssl:
  temperature: 0.2
  proj_hidden: 512
  proj_dim: 128
  lambda_contrast: 0.2
  init_checkpoint: runs/simclr_pretrain_seed0/last.pt
optim:
  optimizer: adamw
  lr: 0.001
  head_lr_mult: 1.0
  weight_decay: 0.01
  momentum: 0.9
  nesterov: true
  scheduler: cosine
  warmup_epochs: 5
  min_lr: 1.0e-06
  epochs: 50
  grad_clip: 1.0
  label_smoothing: 0.1
  amp: true
eval:
  tta: none
output:
  root: runs
