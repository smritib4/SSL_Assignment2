experiment:
  name: simclr_pretrain
  notes: SimCLR NT-Xent on ResNet-18 from scratch. Encoder is what gets transferred.
  seed: 0
  mode: pretrain
  config_path: configs/simclr_pretrain.yaml
data:
  root: data
  train_dir: train
  test_dir: test
  val_fraction: 0.2
  split: stratified
  batch_size: 128
  num_workers: 2
  img_size: 128
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
augment:
  train_crop_scale:
  - 0.3
  - 1.0
  hflip: 0.5
  color_jitter: 0.4
  jitter_hue: 0.1
  jitter_p: 0.8
  grayscale_p: 0.2
  blur_p: 0.5
  blur_sigma:
  - 0.1
  - 2.0
  random_erasing: 0.0
model:
  name: resnet18
  dropout: 0.0
  freeze_encoder: false
ssl:
  temperature: 0.2
  proj_hidden: 512
  proj_dim: 128
  lambda_contrast: 0.2
  init_checkpoint: ''
optim:
  optimizer: adamw
  lr: 0.001
  head_lr_mult: 1.0
  weight_decay: 0.0001
  momentum: 0.9
  nesterov: true
  scheduler: cosine
  warmup_epochs: 10
  min_lr: 1.0e-06
  epochs: 100
  grad_clip: 1.0
  label_smoothing: 0.0
  amp: true
eval:
  tta: none
output:
  root: runs
